name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      # The archlinux image has no git; checkout with submodules needs a real git, not the REST fallback.
      - name: Install git
        run: pacman -Sy --noconfirm --needed git
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install toolchain
        run: |
          pacman -Syu --noconfirm --needed git base-devel cmake ninja rustup
          rustup default stable
          rustup component add rustfmt clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: image sizing
        run: |
          cmake -S cpp -B cpp/build-sizing -G Ninja -DTROWEL_BUILD_WORKER=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp/build-sizing --target trowel-image-sizing-test
          cpp/build-sizing/trowel-image-sizing-test

  # Vector parity needs the GGUF files and a GPU. Run scripts/parity.sh locally
  # (Vulkan and CPU) and paste the output into PROGRESS.md. GitHub-hosted
  # runners do not have the Arc 140V.
