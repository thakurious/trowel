[workspace]
resolver = "2"
members = [
    "crates/trowel-core",
    "crates/trowel-proto",
    "crates/troweld",
    "crates/trowel-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/thakurious/trowel"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
unicode-normalization = "0.1"
half = "2"
memmap2 = "0.9"
sha2 = "0.10"
exif = { version = "0.5", package = "kamadak-exif" }
walkdir = "2"
notify = "6"
toml = "0.8"
libc = "0.2"
# D24: calculator, offline, no transitive deps (L0.7).
fend-core = "=1.5.8"

# The 20 ms calc deadline and the < 1 ms budget are about optimized fend; debug fend is ~10x
# slower and would make tests time out on inputs that are instant in the shipped build.
[profile.dev.package.fend-core]
opt-level = 3
