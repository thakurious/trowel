[workspace]
resolver = "2"
members = [
    "crates/trowel-core",
    "crates/trowel-proto",
    "crates/troweld",
    "crates/trowel-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/thakurious/trowel"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
unicode-normalization = "0.1"
half = "2"
memmap2 = "0.9"
sha2 = "0.10"
exif = { version = "0.5", package = "kamadak-exif" }
walkdir = "2"
